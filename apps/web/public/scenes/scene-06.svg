<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 56.25" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22160b"/>
      <stop offset="100%" stop-color="#0d0906"/>
    </linearGradient>
    <radialGradient id="key" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#ffc978" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#ffc978" stop-opacity="0.154"/>
      <stop offset="100%" stop-color="#ffc978" stop-opacity="0"/>
