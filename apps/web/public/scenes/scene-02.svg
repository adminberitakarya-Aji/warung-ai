<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 56.25" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241809"/>
      <stop offset="100%" stop-color="#0e0a07"/>
    </linearGradient>
    <radialGradient id="key" cx="30%" cy="24%" r="40%">
      <stop offset="0%" stop-color="#ffc873" stop-opacity="0.62"/>
      <stop offset="55%" stop-color="#ffc873" stop-opacity="0.1364"/>
      <stop offset="100%" stop-color="#ffc873" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
