    <circle cx="26" cy="55" r="3.4" fill="#a8342a" opacity="0.95"/>
    <circle cx="34" cy="56" r="2.6" fill="#8e2c24" opacity="0.95"/>
    <circle cx="44" cy="55.5" r="2.2" fill="#b8452f" opacity="0.9"/>
