<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 56.25" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111b26"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
    <radialGradient id="key" cx="52%" cy="44%" r="26%">
      <stop offset="0%" stop-color="#ffbe63" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffbe63" stop-opacity="0.187"/>
      <stop offset="100%" stop-color="#ffbe63" stop-opacity="0"/>
